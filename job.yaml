apiVersion: batch/v1
kind: Job
metadata:
  name: demo-job
spec:
  template:
    spec:
      containers:
        - name: demo-job
          image: busybox:1.36
          command: ["sh", "-c", "echo 'Hello from demo job!' && sleep 5 && echo 'Job completed successfully!'"]
      restartPolicy: Never
  backoffLimit: 3
